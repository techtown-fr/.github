name: 🐛 Rapport de bug
description: Signaler un comportement inattendu
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Ce qui se passe
      description: Décrivez le comportement observé.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Aller sur ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Version, navigateur, OS, logs, capture d'écran — tout ce qui peut aider.
    validations:
      required: false
